<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin:0%;
        padding:0%;
    }
    .father {
        background-color: blue;
        display: flex;
        justify-content: space-around;
        align-items: center;
        
    }
    .son1{
        font-size: 40px;
        color: white;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .son {
        color: white;
        font-size: 20px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        display: flex;
        justify-content: space-around;
    }

    ul {
        list-style: none;
        display: flex;
    }

    li {
        margin: 0px 10px;
    }
    input[type="button"] {
        padding: 10px 30px; /* Adjust button padding to change its size */
        font-size: 18px;    /* Adjust font size */
        border-radius: 25px; /* Optional: Adjust button border radius independently */
        background-color: rgb(244, 41, 200);
        color: white;
        box-shadow: 0 8px 8px rgba(132, 51, 51, 0.2);
    }
    
</style>

<body>
    <div class="father">
        <div class="son1">Royal washing</div>
        <div class="son">
            <ul>
                <li>Home</li>
                <li>Services</li>
                <li>Testinomials</li>
                <li>Contact</li>
                <li>About Us</li>
            </ul>
        </div>
        <span class="button">
            <input type="button" value="Book Now">
        </span>
    </div>
</body>

</html>
